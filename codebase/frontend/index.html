<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kẻ Độc Hành — Dạy lại cho AI</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main>
    <h1>Dạy lại khái niệm cho AI học trò</h1>

    <section class="brief">
      <p><strong>Khái niệm cần dạy:</strong> <span id="concept">đang tải…</span></p>
      <p class="rules">
        Giải thích bằng lời của bạn, đừng đọc lại tài liệu. Học trò AI sẽ hỏi lại
        chỗ nó chưa hiểu. Đây là buổi luyện tập, không phải bài kiểm tra — không ai chấm điểm bạn.
      </p>
    </section>

    <p id="status">Chưa kết nối</p>

    <div class="controls">
      <button id="start-btn">Bắt đầu phiên</button>
      <button id="mic-btn" disabled title="Cần cấp quyền micro">🎤 Bật micro</button>
      <button id="done-btn" disabled>✅ Tôi giải thích xong</button>
      <kbd class="hint">Space — nói xong / ngắt lời</kbd>
    </div>

    <section id="transcript" aria-live="polite"></section>

    <p id="partial" class="partial" hidden></p>

    <form id="text-form" class="compose">
      <textarea id="text-input" rows="3" disabled
        placeholder="Giải thích bằng lời của bạn… (Ctrl+Enter để gửi)"></textarea>
      <button id="send-btn" type="submit" disabled>Gửi</button>
    </form>

    <audio id="ai-audio"></audio>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
