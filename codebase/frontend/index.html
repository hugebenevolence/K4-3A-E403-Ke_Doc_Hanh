<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kẻ Độc Hành — Dạy lại cho AI</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="titles">
      <span class="eyebrow">AI &amp; LLM Foundation</span>
      <h1 id="concept">đang tải…</h1>
    </div>
    <div class="live">
      <span id="pulse" class="pulse" data-mode="idle"></span>
      <span id="status">Chưa kết nối</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h2>Slide</h2>
      <ol id="page-list" class="page-list"></ol>
    </aside>

    <main class="stage">
      <div class="slide-bar">
        <button id="prev-page" title="Trang trước (←)">Trước</button>
        <span class="counter">Slide <b id="page-now">–</b> / <span id="page-total">–</span></span>
        <button id="next-page" title="Trang sau (→)">Sau</button>

        <span class="sep" aria-hidden="true"></span>

        <button id="zoom-out" title="Thu nhỏ">Thu nhỏ</button>
        <span id="zoom-level" class="counter">100%</span>
        <button id="zoom-in" title="Phóng to">Phóng to</button>

        <span class="sep" aria-hidden="true"></span>

        <button id="focus-btn" aria-pressed="false" title="Chỉ xem vùng đang dạy (F)">
          Vùng đang dạy
        </button>
        <button id="goto-source" class="quiet" title="Về trang đang dạy (G)">Về trang đang dạy</button>
      </div>
      <div id="slide-wrap" class="slide-wrap">
        <canvas id="slide"></canvas>
        <div id="marks"></div>
      </div>
      <p id="no-slides" class="empty" hidden>Chưa cấu hình slide (SLIDES_PDF trong .env)</p>
    </main>

    <section class="panel">
      <p class="rules">
        Giải thích bằng lời của bạn, đừng đọc lại slide. Học trò AI sẽ hỏi lại chỗ
        nó chưa hiểu. Đây là buổi luyện tập — không ai chấm điểm bạn.
      </p>

      <div id="transcript" class="transcript" aria-live="polite"></div>
      <p id="partial" class="partial" hidden></p>


      <div class="controls">
        <button id="start-btn" class="primary">Bắt đầu phiên</button>
        <button id="mic-btn" disabled>Bật micro</button>
        <button id="done-btn" disabled>Xong</button>
        <kbd class="hint">Space</kbd>
      </div>

      <form id="text-form" class="compose">
        <textarea id="text-input" rows="2" disabled
          placeholder="…hoặc gõ lời giải thích (Ctrl+Enter để gửi)"></textarea>
        <button id="send-btn" type="submit" disabled>Gửi</button>
      </form>
    </section>
  </div>

  <audio id="ai-audio"></audio>
  <script type="module" src="js/app.js"></script>
</body>
</html>
