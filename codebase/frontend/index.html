<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kẻ Độc Hành — Dạy lại cho AI</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main>
    <h1>Dạy lại khái niệm cho AI học trò</h1>
    <p id="status">Chưa kết nối</p>

    <div class="controls">
      <button id="start-btn">Bắt đầu phiên</button>
      <button id="done-btn" disabled>✅ Tôi giải thích xong</button>
    </div>

    <section id="transcript" aria-live="polite"></section>

    <audio id="ai-audio" autoplay></audio>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
